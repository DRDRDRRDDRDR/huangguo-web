<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黄果短剧解析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">黄</span><div><strong>黄果解析</strong><small>短剧 · 漫剧 · AI 内容</small></div></div>
  <a href="https://huangguoai.com" target="_blank" rel="noreferrer">访问官方站 ↗</a>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">HUANGGUO / FONGMI ADAPTER</div>
    <h1>发现下一部<br><em>想看的短剧。</em></h1>
    <p>基于 huangguo-fongmi 适配逻辑，快速检索、查看剧集并直接播放。</p>
    <form id="search">
      <input id="keyword" placeholder="搜索剧名，例如：霸总、重生、逆袭" autocomplete="off">
      <button>搜索</button>
    </form>
    <div class="quick">
      <button data-q="热门">热门</button>
      <button data-q="AI短剧">AI短剧</button>
      <button data-q="AI漫剧">AI漫剧</button>
      <button data-q="AI换脸">AI换脸</button>
    </div>
  </section>
  <section class="toolbar">
    <div><span class="section-label">精选内容</span><h2 id="heading">正在加载</h2></div>
    <div class="tabs" id="tabs">
      <button class="active" data-path="/">首页</button>
      <button data-path="/ai-duanju/">AI短剧</button>
      <button data-path="/ai-manju/">AI漫剧</button>
      <button data-path="/ai-huanlian/">AI换脸</button>
      <button data-path="/ranks/hot/">排行榜</button>
    </div>
  </section>
  <div id="status" class="status">正在连接黄果源站…</div>
  <section id="grid" class="grid"></section>
</main>
<dialog id="detail">
  <button class="close" id="close">×</button>
  <div id="detail-content"></div>
</dialog>
<footer>内容来自公开站点，仅作技术演示。请遵守当地法律法规与版权规则。</footer>
<script src="https://huangguo-parser.13681235735.workers.dev/hls.js"></script>
<script>
const API_BASE='https://huangguo-parser.13681235735.workers.dev';
const $=s=>document.querySelector(s),grid=$('#grid'),status=$('#status');
let hlsPlayer=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path){const r=await fetch(API_BASE+'/api'+path);if(!r.ok)throw Error('请求失败');return r.json()}
function render(list){
  grid.innerHTML=list.length?list.map(x=>`<article class="card" data-id="${esc(x.vod_id)}"><div class="cover">${x.vod_pic?`<img src="${API_BASE}${x.vod_pic}" loading="lazy" alt="${esc(x.vod_name)}">`:'<span>黄果</span>'}</div><div class="card-body"><h3>${esc(x.vod_name)}</h3><p>${esc(x.vod_remarks||'黄果短剧')}</p></div></article>`).join(''):'<div class="empty">暂无结果，试试换个关键词。</div>';
  grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}
async function load(path='/',title='正在更新'){
  status.textContent='加载中…';$('#heading').textContent=title;
  try{const d=await api(path);render(d.list||[]);status.textContent=`共 ${d.list?.length||0} 部`;}
  catch(e){status.textContent='源站暂时不可用，请稍后重试。';grid.innerHTML=''}
}
function destroyPlayer(){if(hlsPlayer){try{hlsPlayer.destroy()}catch(e){}hlsPlayer=null}}
async function openDetail(id){
  const d=$('#detail'),box=$('#detail-content');
  d.showModal();box.innerHTML='<div class="loading">正在读取剧集…</div>';
  try{
    const x=(await api('/detail/'+id)).list?.[0];
    if(!x)throw Error();
    box.innerHTML=`<div class="detail-head">${x.vod_pic?`<img src="${API_BASE}${x.vod_pic}" alt="${esc(x.vod_name)}">`:''}<div><div class="eyebrow">黄果短剧</div><h2>${esc(x.vod_name)}</h2><p>选择集数开始播放</p></div></div><div class="episodes">${(x.episodes||[]).map(e=>`<button data-url="${encodeURIComponent(e.url)}" data-ep="${e.ep}">第${e.ep}集</button>`).join('')}</div><div id="player"></div>`;
    box.querySelectorAll('.episodes button').forEach(b=>b.onclick=()=>play(b.dataset.url,b.dataset.ep));
  }catch(e){box.innerHTML='<div class="empty">详情读取失败。</div>'}
}
async function play(url,ep){
  const p=$('#player');
  destroyPlayer();
  p.innerHTML='<div class="loading">正在解析第'+ep+'集…</div>';
  try{
    const d=await api('/play?url='+url+'&ep='+ep);
    if(!d.url)throw Error('未取到播放地址');
    const src=d.proxy||d.url;
    p.innerHTML=`<video id="video" controls autoplay playsinline></video><a class="source" href="${esc(d.url)}" target="_blank" rel="noreferrer">无法播放？打开原始地址 ↗</a>`;
    const video=$('#video');
    if(window.Hls&&window.Hls.isSupported()){
      hlsPlayer=new window.Hls({lowLatencyMode:false});
      hlsPlayer.loadSource(src);
      hlsPlayer.attachMedia(video);
      hlsPlayer.on(window.Hls.Events.ERROR,function(_e,data){
        if(data&&data.fatal){
          const el=$('#player');
          if(el)el.innerHTML='<div class="error">播放失败：'+esc(data.details||'未知错误')+'</div>';
          destroyPlayer();
        }
      });
    }else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=src;
    }else{
      p.innerHTML='<div class="error">当前浏览器不支持 HLS 播放。</div>';
    }
  }catch(e){
    p.innerHTML='<div class="error">播放地址解析失败，请换一集重试。</div>';
  }
}
$('#search').onsubmit=e=>{e.preventDefault();const q=$('#keyword').value.trim();if(q)load('/search/'+encodeURIComponent(q)+'/','搜索：'+q)};
$('#tabs').onclick=e=>{if(e.target.matches('button')){$('#tabs .active').classList.remove('active');e.target.classList.add('active');load(e.target.dataset.path,e.target.textContent)}};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('#keyword').value=b.dataset.q;$('#search').requestSubmit()});
$('#close').onclick=()=>{destroyPlayer();$('#detail').close()};
$('#detail').addEventListener('close',destroyPlayer);
load();
</script>
</body>
</html>
