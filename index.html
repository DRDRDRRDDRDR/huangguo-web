<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部剧集 · 黄果解析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">黄</span><div><strong>黄果解析</strong><small>全部剧集</small></div></div>
  <nav class="top-nav">
    <a class="active" href="index.html">全部剧集</a>
    <a href="ranks.html">排行榜</a>
    <a href="topics.html">专辑专题</a>
    <a href="chigua.html">黄果吃瓜</a>
    <a href="api.html">接口</a>
    <a href="https://huangguoai.com" target="_blank" rel="noreferrer">官方站 ↗</a>
  </nav>
</header>

<main>
  <section class="hero compact">
    <div class="eyebrow">HUANGGUO / FONGMI ADAPTER</div>
    <h1>全部剧集</h1>
    <p>按分类与排序浏览，向下滚动自动加载，每次 50 部。</p>
    <form id="search">
      <input id="keyword" placeholder="搜索剧名，例如：东京、母子、换脸" autocomplete="off">
      <button>搜索</button>
    </form>
  </section>

  <section class="panel" id="sec-list">
    <div class="panel-head">
      <div><span class="section-label">CATEGORY · 分类</span><h2 id="heading">全部剧集</h2></div>
      <div class="chips" id="cat-tabs"></div>
    </div>
    <div class="chips sub" id="sort-tabs"></div>
    <div id="status" class="status">正在连接黄果源站…</div>
    <section id="grid" class="grid"></section>
    <div class="load-more" id="load-more"></div>
  </section>
</main>

<footer>内容来自公开站点，仅作技术演示。请遵守当地法律法规与版权规则。</footer>

<script src="app.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const STATE = { cat: 'ai-duanju', sort: 'latest', page: 0, pages: 1, total: 0, loading: false, searching: false, query: '' };

async function loadPage(reset) {
  if (STATE.loading) return;
  if (!reset && STATE.page >= STATE.pages) return;
  STATE.loading = true;
  const grid = $('#grid');
  setStatus($('#status'), STATE.page === 0 ? '加载中…' : `加载中…（已显示 ${grid.querySelectorAll('.card').length} 部）`);
  try {
    const next = reset ? 1 : STATE.page + 1;
    const d = STATE.searching
      ? await api('/search/' + encodeURIComponent(STATE.query) + '?page=' + next + '&size=' + PAGE_SIZE)
      : await api('/category/' + STATE.cat + '?page=' + next + '&size=' + PAGE_SIZE + '&sort=' + STATE.sort);
    const list = d.list || [];
    STATE.page = d.page || next;
    STATE.pages = d.pagecount || 1;
    STATE.total = d.total || list.length;
    if (reset) grid.innerHTML = '';
    if (!list.length && reset) { grid.innerHTML = '<div class="empty">该分类暂无内容</div>'; }
    else grid.insertAdjacentHTML('beforeend', gridHtml(list));
    bindCards(grid);
    const shown = grid.querySelectorAll('.card').length;
    setStatus($('#status'), `共 ${STATE.total} 部 · 已显示 ${shown} 部 · 第 ${STATE.page}/${STATE.pages} 页 · 数据源 ${d.source || '-'}`);
    $('#load-more').innerHTML = STATE.page >= STATE.pages
      ? '<div class="done">已加载全部内容</div>'
      : '<button id="more">加载更多（50 部）</button>';
    const more = $('#more');
    if (more) more.onclick = () => loadPage(false);
  } catch (e) {
    setStatus($('#status'), '源站暂时不可用，请稍后重试。');
  } finally {
    STATE.loading = false;
  }
}

function reset() {
  STATE.page = 0;
  STATE.pages = 1;
  loadPage(true);
}

// 滚动到底部自动加载
window.addEventListener('scroll', () => {
  if (STATE.loading || STATE.page >= STATE.pages) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 700) loadPage(false);
});

async function init() {
  const meta = await loadMeta();
  chips($('#cat-tabs'), meta.cats.map((c) => ({ n: c.type_name, v: c.type_id })), STATE.cat, (v) => {
    STATE.cat = v; STATE.searching = false; $('#keyword').value = '';
    $('#heading').textContent = (meta.cats.find((c) => c.type_id === v) || {}).type_name || '全部剧集';
    reset();
  });
  chips($('#sort-tabs'), meta.sorts.map((s) => ({ n: s.n, v: s.v })), STATE.sort, (v) => { STATE.sort = v; reset(); });
  $('#search').onsubmit = (e) => {
    e.preventDefault();
    const q = $('#keyword').value.trim();
    if (!q) { STATE.searching = false; reset(); return; }
    STATE.searching = true; STATE.query = q;
    $('#heading').textContent = '搜索：' + q;
    reset();
  };
  reset();
}
init();
</script>
</body>
</html>
