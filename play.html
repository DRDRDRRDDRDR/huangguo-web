<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播放 · 黄果解析</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="play.css">
</head>
<body class="play-body">
<header class="topbar">
  <div class="brand"><a class="mark" href="index.html">黄</a><div><a class="home-link" href="index.html"><strong>黄果解析</strong></a><small>播放页</small></div></div>
  <div class="top-actions">
    <a href="https://huangguoai.com" target="_blank" rel="noreferrer">官方站 ↗</a>
    <a href="index.html">← 返回首页</a>
  </div>
</header>

<main class="play-main">
  <section class="player-wrap">
    <div class="player-box" id="player-box">
      <div class="player-loading" id="player-loading">正在加载播放器…</div>
      <video id="video" controls autoplay playsinline preload="metadata"></video>
    </div>
    <div class="player-bar">
      <div class="player-title" id="player-title">加载中…</div>
      <div class="player-actions">
        <button id="btn-prev" disabled>上一集</button>
        <button id="btn-next" disabled>下一集</button>
        <a id="btn-source" class="ghost" href="#" target="_blank" rel="noreferrer">原始地址 ↗</a>
      </div>
    </div>
    <div class="player-status" id="player-status"></div>
  </section>

  <section class="info-grid">
    <aside class="poster-col">
      <div class="poster" id="poster"></div>
      <div class="meta-list" id="meta-list"></div>
    </aside>
    <div class="info-col">
      <span class="section-label">DETAIL · 剧集信息</span>
      <h1 id="title">加载中…</h1>
      <div class="tags" id="tags"></div>
      <p class="desc" id="desc"></p>
      <div class="ep-block">
        <div class="ep-head"><span class="section-label">EPISODES · 选集</span><span id="ep-count"></span></div>
        <div class="episodes" id="episodes"></div>
      </div>
      <div class="related-block">
        <div class="ep-head"><span class="section-label">RELATED · 相关推荐</span></div>
        <section class="grid" id="related"></section>
      </div>
    </div>
  </section>
</main>

<footer>内容来自公开站点，仅作技术演示。请遵守当地法律法规与版权规则。</footer>

<script src="https://huangguo-parser.13681235735.workers.dev/hls.js"></script>
<script>
const API_BASE='https://huangguo-parser.13681235735.workers.dev';
const $=s=>document.querySelector(s);
let hlsPlayer=null;
let DATA={id:'',ep:'1',episodes:[],list:null};

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path){const r=await fetch(API_BASE+'/api'+path);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function qs(k,d){const v=new URLSearchParams(location.search).get(k);return v===null?d:v}

function destroyPlayer(){if(hlsPlayer){try{hlsPlayer.destroy()}catch(e){}hlsPlayer=null}}
function setStatus(t,cls){const el=$('#player-status');el.textContent=t||'';el.className='player-status'+(cls?' '+cls:'')}

function playStream(src){
  const video=$('#video');
  destroyPlayer();
  $('#player-loading').style.display='none';
  if(window.Hls&&window.Hls.isSupported()){
    hlsPlayer=new window.Hls({lowLatencyMode:false});
    hlsPlayer.loadSource(src);
    hlsPlayer.attachMedia(video);
    hlsPlayer.on(window.Hls.Events.ERROR,function(_e,data){
      if(data&&data.fatal){
        setStatus('播放失败：'+(data.details||'未知错误'),'bad');
        destroyPlayer();
      }
    });
    setStatus('HLS 播放中');
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=src;setStatus('原生 HLS 播放');
  }else{
    setStatus('当前浏览器不支持 HLS 播放','bad');
  }
}

function markActive(ep){
  document.querySelectorAll('.episodes button').forEach(b=>b.classList.toggle('active',b.dataset.ep===String(ep)));
  const i=DATA.episodes.findIndex(e=>String(e.ep)===String(ep));
  $('#btn-prev').disabled=i<=0;
  $('#btn-next').disabled=i<0||i>=DATA.episodes.length-1;
}

async function loadEpisode(ep,push){
  DATA.ep=String(ep);
  markActive(DATA.ep);
  if(push){const u=new URL(location.href);u.searchParams.set('id',DATA.id);u.searchParams.set('ep',DATA.ep);history.replaceState(null,'',u)}
  setStatus('正在解析第'+DATA.ep+'集…');
  $('#player-loading').style.display='';
  const item=DATA.episodes.find(e=>String(e.ep)===DATA.ep);
  if(!item){setStatus('未找到该集','bad');return}
  try{
    const d=await api('/play?url='+encodeURIComponent(item.url)+'&ep='+DATA.ep);
    if(!d.url)throw Error('未取到播放地址');
    $('#btn-source').href=d.url;
    playStream(d.proxy||d.url);
  }catch(e){
    setStatus('播放地址解析失败，请换一集重试','bad');
    $('#player-loading').textContent='解析失败';
  }
}

function step(delta){
  const i=DATA.episodes.findIndex(e=>String(e.ep)===DATA.ep);
  const t=DATA.episodes[i+delta];
  if(t)loadEpisode(t.ep,true);
}

async function loadRelated(id){
  try{
    const d=await api('/category/ai-duanju?page=1&size=6&sort=latest');
    const list=(d.list||[]).filter(x=>String(x.vod_id)!==String(id)).slice(0,6);
    $('#related').innerHTML=list.map(x=>`<article class="card" data-id="${esc(x.vod_id)}"><div class="cover">${x.vod_pic?`<img src="${API_BASE}${esc(x.vod_pic)}" loading="lazy" alt="${esc(x.vod_name)}">`:'<span>黄果</span>'}</div><div class="card-body"><h3>${esc(x.vod_name)}</h3><p>${esc(x.vod_remarks||'')}</p></div></article>`).join('');
    $('#related').querySelectorAll('.card').forEach(c=>c.onclick=()=>{location.href='play.html?id='+encodeURIComponent(c.dataset.id)+'&ep=1'});
  }catch(e){$('#related').innerHTML='<div class="empty">推荐加载失败</div>'}
}

async function init(){
  const id=qs('id','');
  const ep=qs('ep','1');
  if(!id){$('#title').textContent='缺少剧集参数';setStatus('请从首页选择剧集进入','bad');return}
  DATA.id=id;
  try{
    const x=(await api('/detail/'+encodeURIComponent(id))).list?.[0];
    if(!x)throw Error('详情为空');
    DATA.list=x;
    DATA.episodes=x.episodes||[];
    document.title=x.vod_name+' · 第'+ep+'集 · 黄果解析';
    $('#title').textContent=x.vod_name;
    $('#player-title').textContent=x.vod_name+' · 第'+ep+'集';
    $('#desc').textContent=x.vod_desc||'暂无简介';
    $('#tags').innerHTML=(x.vod_tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
    $('#poster').innerHTML=x.vod_pic?`<img src="${API_BASE}${esc(x.vod_pic)}" alt="${esc(x.vod_name)}">`:'<span>黄果</span>';
    const meta=[['类型',(x.vod_tags||[]).join(' / ')],['集数',x.vod_episode_count?x.vod_episode_count+' 集':'-'],['状态',x.vod_finished?'已完结':'连载中'],['评分',x.vod_score?x.vod_score+' 分':'-'],['年份',x.vod_year||'-'],['作者',x.vod_author||'-'],['热度',x.vod_hot?Number(x.vod_hot).toLocaleString():'-'],['更新',x.vod_created||'-']];
    $('#meta-list').innerHTML=meta.map(m=>`<div><span>${esc(m[0])}</span><b>${esc(m[1])}</b></div>`).join('');
    $('#ep-count').textContent=DATA.episodes.length+' 集';
    $('#episodes').innerHTML=DATA.episodes.map(e=>`<button data-ep="${esc(e.ep)}" class="${String(e.ep)===String(ep)?'active':''}">${esc(e.title||('第'+e.ep+'集'))}</button>`).join('');
    $('#episodes').querySelectorAll('button').forEach(b=>b.onclick=()=>loadEpisode(b.dataset.ep,true));
    $('#btn-prev').onclick=()=>step(-1);
    $('#btn-next').onclick=()=>step(1);
    document.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT')return;
      if(e.key==='ArrowLeft')step(-1);
      if(e.key==='ArrowRight')step(1);
    });
    loadRelated(id);
    loadEpisode(ep,false);
  }catch(e){
    $('#title').textContent='详情读取失败';
    setStatus('详情读取失败：'+String(e.message||e),'bad');
  }
}
init();
</script>
</body>
</html>
