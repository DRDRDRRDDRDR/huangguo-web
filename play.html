<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播放 · 黄果解析</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="play.css">
</head>
<body class="play-body">
<header class="topbar">
  <div class="brand"><a class="mark" href="index.html">黄</a><div><a class="home-link" href="index.html"><strong>黄果解析</strong></a><small>播放页</small></div></div>
  <nav class="top-nav">
    <a href="index.html">全部剧集</a>
    <a href="ranks.html">排行榜</a>
    <a href="topics.html">专辑专题</a>
    <a href="chigua.html">黄果吃瓜</a>
    <a href="api.html">接口</a>
  </nav>
</header>

<main class="play-main">
  <section class="player-wrap">
    <div class="player-box" id="player-box">
      <div class="player-loading" id="player-loading">正在加载播放器…</div>
      <video id="video" playsinline preload="metadata"></video>
      <div class="hg-ctrl" id="hg-ctrl">
        <button id="btn-play" title="播放/暂停">▶</button>
        <span class="hg-time" id="hg-time">00:00 / 00:00</span>
        <div class="hg-seek" id="hg-seek">
          <div class="hg-seek-track">
            <div class="hg-seek-buffer" id="hg-buffer"></div>
            <div class="hg-seek-played" id="hg-played"></div>
            <div class="hg-seek-thumb" id="hg-thumb"></div>
          </div>
        </div>
        <button id="btn-mute" title="静音">🔊</button>
        <button id="btn-fs" title="全屏">⛶</button>
      </div>
    </div>
    <div class="player-bar">
      <div class="player-title" id="player-title">加载中…</div>
      <div class="player-actions">
        <button id="btn-prev" disabled>上一集</button>
        <button id="btn-next" disabled>下一集</button>
        <a id="btn-source" class="ghost" href="#" target="_blank" rel="noreferrer">原始地址 ↗</a>
      </div>
    </div>
    <div id="warn"></div>
    <div class="player-status" id="player-status"></div>
  </section>

  <section class="info-grid">
    <aside class="poster-col">
      <div class="poster" id="poster"></div>
      <div class="meta-list" id="meta-list"></div>
    </aside>
    <div class="info-col">
      <span class="section-label">DETAIL · 剧集信息</span>
      <h1 id="title">加载中…</h1>
      <div class="tags" id="tags"></div>
      <p class="desc" id="desc"></p>
      <div class="ep-block">
        <div class="ep-head"><span class="section-label">EPISODES · 选集</span><span id="ep-count"></span></div>
        <div class="episodes" id="episodes"></div>
      </div>
      <div class="related-block">
        <div class="ep-head"><span class="section-label">RELATED · 相关推荐</span></div>
        <section class="grid" id="related"></section>
      </div>
    </div>
  </section>
</main>

<footer>内容来自公开站点，仅作技术演示。请遵守当地法律法规与版权规则。</footer>

<script src="https://huangguo-parser.13681235735.workers.dev/hls.js"></script>
<script src="app.js"></script>
<script>
const $=s=>document.querySelector(s);
let hlsPlayer=null;
let DATA={id:'',ep:'1',episodes:[],list:null};

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function qs(k,d){const v=new URLSearchParams(location.search).get(k);return v===null?d:v}
function fmtDur(s){s=Math.round(Number(s)||0);if(!s)return '-';const m=Math.floor(s/60),r=s%60;return m?m+' 分 '+r+' 秒':r+' 秒';}

function destroyPlayer(){if(hlsPlayer){try{hlsPlayer.destroy()}catch(e){}hlsPlayer=null}}
function setPlayerStatus(t,cls){const el=$('#player-status');el.textContent=t||'';el.className='player-status'+(cls?' '+cls:'')}
function setWarn(html){$('#warn').innerHTML=html||''}

// 播放：**优先直连原始 m3u8**。
// 原因：CDN 按请求出口 IP 下发不同播放列表 —— 浏览器出口=用户真实 IP，能拿到完整片源；
// 若走 Cloudflare Worker 代理，出口是数据中心 IP，只会拿到约 54 秒的预览片段。
// 因此 direct 是首选，fallback（Worker /raw 代理）仅在直连失败时兜底。
// ===== 自定义播放控制条 =====
// 不依赖原生 controls：各浏览器把控制栏裁掉或在高 z-index 层下方时，原生控件会消失。
function fmtTime(s){
  s=Math.max(0,Math.floor(Number(s)||0));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`;
}
function bindControls(){
  const box=$('#player-box'), video=$('#video');
  if(!video||!box)return;
  const btnPlay=$('#btn-play'), btnMute=$('#btn-mute'), btnFs=$('#btn-fs');
  const timeEl=$('#hg-time'), seek=$('#hg-seek');
  const played=$('#hg-played'), buffer=$('#hg-buffer'), thumb=$('#hg-thumb');

  function paint(){
    const d=video.duration;
    const pct=(d&&isFinite(d))?(video.currentTime/d*100):0;
    played.style.width=pct+'%';
    thumb.style.left=pct+'%';
    let buf=0;
    try{ if(video.buffered.length&&d) buf=video.buffered.end(video.buffered.length-1)/d*100; }catch(e){}
    buffer.style.width=Math.min(100,buf)+'%';
    timeEl.textContent=fmtTime(video.currentTime)+' / '+(d&&isFinite(d)?fmtTime(d):'00:00');
    btnPlay.textContent=video.paused?'▶':'❚❚';
  }
  video.addEventListener('timeupdate',paint);
  video.addEventListener('durationchange',paint);
  video.addEventListener('progress',paint);
  video.addEventListener('loadedmetadata',paint);
  video.addEventListener('play',paint);
  video.addEventListener('pause',paint);

  btnPlay.onclick=()=>{ video.paused?video.play().catch(()=>{}):video.pause(); };
  video.addEventListener('click',()=>{ video.paused?video.play().catch(()=>{}):video.pause(); });

  btnMute.onclick=()=>{ video.muted=!video.muted; btnMute.textContent=video.muted?'🔇':'🔊'; };
  btnFs.onclick=()=>{
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
    else if(box.requestFullscreen)box.requestFullscreen().catch(()=>{});
    else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
  };

  // 控制条内的交互不应冒泡到 video，否则松手时的 click 会误触发暂停
  const ctrl=$('#hg-ctrl');
  if(ctrl){
    ['click','pointerdown','pointerup','pointermove','dblclick'].forEach(ev=>{
      ctrl.addEventListener(ev,e=>e.stopPropagation());
    });
  }

  // 拖动/点击跳转：按下即跟随，松开结束
  let dragging=false;
  function seekTo(ev){
    const r=seek.getBoundingClientRect();
    const x=Math.min(Math.max((ev.clientX-r.left)/r.width,0),1);
    const d=video.duration;
    if(d&&isFinite(d)){ video.currentTime=x*d; paint(); }
  }
  seek.addEventListener('pointerdown',e=>{ dragging=true; seek.setPointerCapture&&seek.setPointerCapture(e.pointerId); seekTo(e); });
  seek.addEventListener('pointermove',e=>{ if(dragging)seekTo(e); });
  seek.addEventListener('pointerup',e=>{ dragging=false; seek.releasePointerCapture&&seek.releasePointerCapture(e.pointerId); });
  seek.addEventListener('pointercancel',()=>{ dragging=false; });

  // 鼠标静止 2.4 秒后淡出控制条，移动即恢复
  let idleTimer=null;
  function wake(){
    box.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>{ if(!video.paused)box.classList.add('idle'); },2400);
  }
  ['pointermove','pointerdown','touchstart'].forEach(ev=>box.addEventListener(ev,wake,{passive:true}));
  video.addEventListener('play',wake);
  wake();
  paint();
  window.__hgPaint = paint;
}

function playStream(direct, fallback, triedFallback){
  const video=$('#video');
  destroyPlayer();
  $('#player-loading').style.display='none';
  if(!window.Hls||!window.Hls.isSupported()){
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=direct;setPlayerStatus('原生 HLS 播放');
    }else{
      setPlayerStatus('当前浏览器不支持 HLS 播放','bad');
    }
    return;
  }
  hlsPlayer=new window.Hls({lowLatencyMode:false});
  hlsPlayer.loadSource(direct);
  hlsPlayer.attachMedia(video);
  // hls 解析出时长后立刻刷新控制条，否则首帧前时间条一直是 00:00
  hlsPlayer.on(window.Hls.Events.MANIFEST_PARSED,function(){
    const v=$('#video'); if(v){ try{v.play().catch(()=>{});}catch(e){} }
    if(window.__hgPaint) window.__hgPaint();
  });
  hlsPlayer.on(window.Hls.Events.ERROR,function(_e,data){
    if(!data||!data.fatal)return;
    // 直连失败（CORS/签名/网络）→ 自动回退到 Worker 代理，只回退一次
    if(!triedFallback&&fallback&&fallback!==direct){
      setPlayerStatus('直连失败，改用代理重试…');
      destroyPlayer();
      playStream(fallback,null,true);
      return;
    }
    setPlayerStatus('播放失败：'+(data.details||'未知错误'),'bad');
    destroyPlayer();
  });
}

function markActive(ep){
  document.querySelectorAll('.episodes button').forEach(b=>b.classList.toggle('active',b.dataset.ep===String(ep)));
  const i=DATA.episodes.findIndex(e=>String(e.ep)===String(ep));
  $('#btn-prev').disabled=i<=0;
  $('#btn-next').disabled=i<0||i>=DATA.episodes.length-1;
}

async function loadEpisode(ep,push){
  DATA.ep=String(ep);
  markActive(DATA.ep);
  if(push){const u=new URL(location.href);u.searchParams.set('id',DATA.id);u.searchParams.set('ep',DATA.ep);history.replaceState(null,'',u)}
  setPlayerStatus('正在解析第'+DATA.ep+'集…');
  setWarn('');
  $('#player-loading').style.display='';
  try{
    // 播放地址只能经 Worker 取：源站加密端点拦截了 github.io 的 Origin
    const d=await getPlay(DATA.id, DATA.ep);
    if(!d.url)throw Error('未取到播放地址');
    $('#btn-source').href=d.url;
    const parts=['数据源 '+(d.source==='dx150'?'加密接口':'页面数据')];
    if(d.declaredDuration)parts.push('本集 '+fmtDur(d.declaredDuration));
    setPlayerStatus(parts.join(' · '));
    playStream(d.url, d.proxy || null, false);
  }catch(e){
    setPlayerStatus('播放地址解析失败，请换一集重试','bad');
    $('#player-loading').textContent='解析失败';
  }
}

function step(delta){
  const i=DATA.episodes.findIndex(e=>String(e.ep)===DATA.ep);
  const t=DATA.episodes[i+delta];
  if(t)loadEpisode(t.ep,true);
}

async function loadRelated(id){
  try{
    const d=await api('/category/ai-duanju?page=1&size=6&sort=latest');
    const list=(d.list||[]).filter(x=>String(x.vod_id)!==String(id)).slice(0,6);
    $('#related').innerHTML=list.map(x=>`<article class="card" data-id="${esc(x.vod_id)}"><div class="cover">${x.vod_pic?`<img src="${esc(mediaUrl(x.vod_pic))}" loading="lazy" alt="${esc(x.vod_name)}">`:'<span>黄果</span>'}</div><div class="card-body"><h3>${esc(x.vod_name)}</h3><p>${esc(x.vod_remarks||'')}</p></div></article>`).join('');
    $('#related').querySelectorAll('.card').forEach(c=>c.onclick=()=>{location.href='play.html?id='+encodeURIComponent(c.dataset.id)+'&ep=1'});
  }catch(e){$('#related').innerHTML='<div class="empty">推荐加载失败</div>'}
}

async function init(){
  const id=qs('id','');
  const ep=qs('ep','1');
  if(!id){$('#title').textContent='缺少剧集参数';setPlayerStatus('请从首页选择剧集进入','bad');return}
  DATA.id=id;
  try{
    const x=(await api('/detail/'+encodeURIComponent(id))).list?.[0];
    if(!x)throw Error('详情为空');
    DATA.list=x;
    DATA.episodes=x.episodes||[];
    document.title=x.vod_name+' · 第'+ep+'集 · 黄果解析';
    $('#title').textContent=x.vod_name;
    $('#player-title').textContent=x.vod_name+' · 第'+ep+'集';
    $('#desc').textContent=x.vod_desc||'暂无简介';
    $('#tags').innerHTML=(x.vod_tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
    $('#poster').innerHTML=x.vod_pic?`<img src="${esc(mediaUrl(x.vod_pic))}" alt="${esc(x.vod_name)}">`:'<span>黄果</span>';
    const meta=[['类型',(x.vod_tags||[]).join(' / ')],['集数',x.vod_episode_count?x.vod_episode_count+' 集':'-'],['状态',x.vod_finished?'已完结':'连载中'],['评分',x.vod_score?x.vod_score+' 分':'-'],['年份',x.vod_year||'-'],['作者',x.vod_author||'-'],['热度',x.vod_hot?Number(x.vod_hot).toLocaleString():'-'],['更新',x.vod_created||'-']];
    $('#meta-list').innerHTML=meta.map(m=>`<div><span>${esc(m[0])}</span><b>${esc(m[1])}</b></div>`).join('');
    $('#ep-count').textContent=DATA.episodes.length+' 集';
    $('#episodes').innerHTML=DATA.episodes.map(e=>`<button data-ep="${esc(e.ep)}" class="${String(e.ep)===String(ep)?'active':''}">${esc(e.title||('第'+e.ep+'集'))}</button>`).join('');
    $('#episodes').querySelectorAll('button').forEach(b=>b.onclick=()=>loadEpisode(b.dataset.ep,true));
    $('#btn-prev').onclick=()=>step(-1);
    $('#btn-next').onclick=()=>step(1);
    document.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT')return;
      if(e.key==='ArrowLeft')step(-1);
      if(e.key==='ArrowRight')step(1);
    });
    bindControls();
    loadRelated(id);
    loadEpisode(ep,false);
  }catch(e){
    $('#title').textContent='详情读取失败';
    setPlayerStatus('详情读取失败：'+String(e.message||e),'bad');
  }
}
init();
</script>
</body>
</html>
